[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "indian-unicorn-chatbot"
version = "0.1.0"
description = "Dataset-grounded RAG chatbot for Indian unicorn startups"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "pydantic>=2.7,<3.0",
    "pandas>=2.2,<3.0",
    "numpy>=1.26,<3.0",
    "python-dotenv>=1.0,<2.0",
    "langchain-core>=0.3,<1.0",
    "langchain-openai>=0.2,<1.0",
    "faiss-cpu>=1.8,<2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9.0", "httpx>=0.27,<1.0"]
langfuse = ["langfuse>=3.0,<4.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

